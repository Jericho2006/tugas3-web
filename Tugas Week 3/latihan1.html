<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Jericho</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Jericho Laro</h1>
    </header>
   
    <nav>
        <a href="#tentang">Tentang</a>
        <a href="#jadwal">Jadwal</a>
        <a href="#kontak">Kontak</a>
    </nav>

    <main>
       
        <div class="container">
            
            <section id="tentang">
                <h2>Tentang Saya</h2>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTJhK8eoZ_3D6AEld3dky98Y7TzjHNFtpvF86dSau_D-HJrgIzz-K7d7dOJjfIAjauYXeFxwa8hkXT81O40W3QgdIlNFySJ5V9bizanaL0&s=10" alt="Foto Saya" width="150" class="profile-img">
                <p>Mahasiswa Informatika yang suka membuat website. Berikut adalah beberapa keahlian saya:</p>
               
                <ul class="keahlian-list">
                    <li>HTML & CSS</li>
                    <li>Pemrograman Web Dasar</li>
                    <li>Desain UI/UX</li>
                </ul>
            </section>

            <section id="jadwal">
                <h2>Jadwal Kuliah</h2>
                <table>
                    <tr>
                        <th>Hari</th>
                        <th>Mata Kuliah</th>
                        <th>Jam</th>
                    </tr>
                    <tr>
                        <td>Senin</td>
                        <td>Pemrograman Web</td>
                        <td>08.00</td>
                    </tr>
                </table>
            </section>

            <section id="kontak">
                <h2>Hubungi Saya</h2>
                <form action="#" method="post">
                    <!-- Penggunaan <div> untuk grup form -->
                    <div class="form-group">
                        <label for="nama">Nama:</label>
                        <input type="text" id="nama" name="nama" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="pesan">Pesan:</label>
                        <textarea id="pesan" name="pesan" rows="4"></textarea>
                    </div>

                    <button type="submit">Kirim <span class="icon">➔</span></button>
                </form>
            </section>

        </div>
    </main>

    <footer>
        <p>@2026 Jericho</p>
    </footer>

</body>
</html>
